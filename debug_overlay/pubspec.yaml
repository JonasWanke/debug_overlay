name: debug_overlay
description: View debug infos and change settings via a central overlay for your app.
version: 3.0.0
repository: https://github.com/JonasWanke/debug_overlay/tree/main/debug_overlay
resolution: workspace
screenshots:
  - description: MediaQueryDebugTool
    path: doc/helpers-mediaQuery.png
  - description: LogsDebugTool
    path: doc/helpers-logs.png
  - description: MediaOverrideDebugTool
    path: doc/helpers-mediaOverrides.png
  - description: NetworkDebugTool
    path: doc/helpers-network.png
  - description: RenderingDebugTool
    path: doc/helpers-rendering.png

environment:
  sdk: ^3.14.0
  flutter: '>=3.50.0'

dependencies:
  black_hole_flutter: ^2.0.0
  collection: ^1.15.0
  flutter:
    sdk: flutter
  implicitly_animated_list: ^2.3.0
  json_view: ^0.4.2
  material_ui: ^1.8.0
  meta: ^1.3.0
  sliver_tools: ^0.2.12

dev_dependencies:
  flutter_test:
    sdk: flutter
