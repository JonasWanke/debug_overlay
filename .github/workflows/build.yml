name: Build & Lint

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: 0 4 * * 1
  workflow_dispatch:

env:
  JAVA_VERSION: 17

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        flutter-channel: [stable, beta]
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: zulu
          java-version: ${{ env.JAVA_VERSION }}
      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: ${{ matrix.flutter-channel }}
      - run: flutter --version

      - run: flutter pub get

      - run: flutter analyze

      - run: flutter test
        working-directory: debug_overlay

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .

  publish-dry-run:
    name: Publish dry run (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - debug_overlay
          - debug_overlay_device_info_plus
          - debug_overlay_dio
          - debug_overlay_file_browser
          - debug_overlay_http
          - debug_overlay_package_info_plus
          - debug_overlay_shared_preferences
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter pub publish --dry-run
        working-directory: ${{ matrix.package }}

  build-example:
    name: Build example
    runs-on: ubuntu-latest
    strategy:
      matrix:
        flutter-channel: [stable, beta]
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: zulu
          java-version: ${{ env.JAVA_VERSION }}
      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: ${{ matrix.flutter-channel }}
      - run: flutter --version

      - run: flutter pub get
        working-directory: debug_overlay/example

      - run: flutter build apk
        working-directory: debug_overlay/example

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: example-apk-flutter-${{ matrix.flutter-channel }}
          path: debug_overlay/example/build/app/outputs/apk/release/app-release.apk
